<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Docs Studio</title>
<link rel="stylesheet" href="/theme/site.css">
<link rel="stylesheet" href="/hub/hub.css">
<script>
  (function () { var t = null; try { t = localStorage.getItem("avs-docs-theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="2" y="3" width="8" height="8" rx="2.5" fill="currentColor" opacity=".9"/><rect x="14" y="3" width="8" height="8" rx="2.5" fill="currentColor" opacity=".35"/><rect x="2" y="13" width="8" height="8" rx="2.5" fill="currentColor" opacity=".35"/><rect x="14" y="13" width="8" height="8" rx="2.5" fill="currentColor" opacity=".6"/></svg>
    <span>Docs Studio</span>
  </a>
  <div class="actions" style="margin-left:auto">
    <span class="hub-user" id="hub-user"></span>
    <button id="theme-toggle" class="icon-btn always" type="button" aria-label="Switch between light and dark">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>
<main id="app" class="hub-main"><p class="muted">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/hub/hub.js"></script>
</body>
</html>
